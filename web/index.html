<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聊聊卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E8202A; --purple:#7B2FBE; --yellow:#FFD400; --green:#14A84B; --blue:#1268C4; --black:#16161A;
  --bg:#FFF6E0; --ink:#16161A; --paper:#FFFFFF;
  --fun:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --text:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--ink);font-family:var(--text);
  overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
}
/* 背景里漂浮的彩色圆点 */
.dots{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.dots i{position:absolute;border-radius:50%;opacity:.16;animation:float 9s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px)}}

main{position:relative;z-index:1;width:100%;max-width:440px;height:100%;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px}

/* 标题：UNO 式倾斜椭圆 */
.logo{margin-top:6px;background:var(--red);border:4px solid var(--yellow);border-radius:50%;
  padding:6px 30px;transform:rotate(-8deg);box-shadow:0 5px 0 var(--black);animation:wiggle 3s ease-in-out infinite}
.logo h1{margin:0;font-family:var(--fun);font-weight:400;font-size:34px;color:var(--yellow);
  letter-spacing:4px;text-shadow:3px 3px 0 var(--black);-webkit-text-stroke:1px var(--black)}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-3deg) scale(1.04)}}

/* 筛选 */
.filters{width:100%;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--fun);font-size:14px;border:3px solid var(--black);border-radius:999px;
  padding:3px 10px;background:var(--paper);color:var(--ink);cursor:pointer;
  box-shadow:0 3px 0 var(--black);transition:transform .15s}
.chip:active{transform:translateY(3px);box-shadow:0 0 0 var(--black)}
.chip.on{color:#fff}
.chip.on[data-c=yellow]{color:var(--black)}
.chip[data-c=red].on{background:var(--red)} .chip[data-c=yellow].on{background:var(--yellow)}
.chip[data-c=green].on{background:var(--green)} .chip[data-c=blue].on{background:var(--blue)}
.chip[data-c=black].on{background:var(--black)} .chip[data-c=purple].on{background:var(--purple)}
.chip[data-c=wild].on{background:conic-gradient(var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0);text-shadow:0 1px 2px #000}
.chip.lv.on{background:var(--black)}
.chip:not(.on){background:transparent;color:#A8A29A;border:2px dashed #C9C2B6;box-shadow:none;text-decoration:line-through;transform:scale(.94)}
.chip.on{transform:translateY(-2px);box-shadow:0 5px 0 var(--black)}
.chip.on::before{content:"✓ ";font-weight:700}

/* 牌桌 */
.table{position:relative;width:100%;flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;perspective:1200px}
.card{width:min(300px,82vw,calc((100cqh - 16px) * 2 / 3));aspect-ratio:2/3;border-radius:22px;border:8px solid #fff;
  box-shadow:0 0 0 3px var(--black),0 12px 0 -2px rgba(0,0,0,.25);position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}

/* 牌背 */
.back{background:var(--black);cursor:pointer;animation:bob 2.2s ease-in-out infinite}
.back::before{content:"";position:absolute;width:115%;height:62%;background:var(--red);
  border-radius:50%;transform:rotate(-55deg)}
.back span{position:relative;font-family:var(--fun);font-size:58px;color:var(--yellow);
  transform:rotate(-14deg);text-shadow:4px 4px 0 var(--black);-webkit-text-stroke:2px var(--black)}
.back small{position:absolute;bottom:18px;font-family:var(--fun);color:#fff;font-size:15px;opacity:.85}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.stack{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none}
.stack .card{position:absolute;background:var(--black)}
.stack .card:nth-child(1){transform:rotate(7deg) translate(10px,6px)}
.stack .card:nth-child(2){transform:rotate(-5deg) translate(-8px,4px)}

/* 牌面 */
.front{container-type:inline-size;color:#fff;animation:deal .55s cubic-bezier(.2,1.6,.4,1) both}
.front[data-c=red]{background:var(--red)} .front[data-c=yellow]{background:var(--yellow);color:var(--black)}
.front[data-c=green]{background:var(--green)} .front[data-c=blue]{background:var(--blue)}
.front[data-c=black]{background:var(--black)} .front[data-c=purple]{background:var(--purple)}
.front[data-c=wild]{background:conic-gradient(from 20deg,var(--red) 0 25%,var(--blue) 0 50%,var(--yellow) 0 75%,var(--green) 0)}
@keyframes deal{0%{transform:translateY(-60px) rotateY(90deg) scale(.7);opacity:0}
  100%{transform:none;opacity:1}}
.front .oval{position:absolute;width:118%;height:70%;background:#fff;border-radius:50%;transform:rotate(-55deg)}
.front .q{position:relative;z-index:1;width:84%;color:var(--black);text-align:center;
  font-weight:800;font-size:7cqw;line-height:1.45}
.front .f{display:block;margin-top:.7em;font-size:4.6cqw;font-weight:500;line-height:1.45;color:#555}
.spicy{position:absolute;bottom:12px;left:12px;z-index:1;font-size:9cqw;line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.5));animation:wiggle 1.6s ease-in-out infinite}
.front .tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;
  background:var(--black);color:#fff;border-radius:999px;padding:2px 9px}
/* 附加规则横幅 */
.rule{display:block;width:max-content;max-width:100%;margin:0 auto .7em;padding:.35em .8em;border-radius:10px;
  border:2px solid var(--black);box-shadow:0 3px 0 var(--black);color:#fff;font-family:var(--fun);font-weight:400;
  font-size:5.2cqw;line-height:1.3;transform:rotate(-3deg);animation:pop .5s .35s cubic-bezier(.2,1.8,.4,1) both}
.rule small{display:block;font-family:var(--text);font-size:4.4cqw;font-weight:600;opacity:.95}
.rule[data-r=reverse]{background:var(--red)} .rule[data-r=pass]{background:var(--blue)}
.rule[data-r=all]{background:var(--green)} .rule[data-r=metoo]{background:var(--purple)}
@keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
/* 功能牌：黑底四色椭圆 */
.front[data-c=action]{background:var(--black)}
.front[data-c=action] .oval{background:conic-gradient(var(--red) 0 25%,var(--yellow) 0 50%,var(--green) 0 75%,var(--blue) 0)}
.front .act{position:relative;z-index:1;width:78%;background:#fff;border:3px solid var(--black);border-radius:18px;
  padding:6cqw 5cqw;text-align:center;color:var(--black);box-shadow:0 5px 0 var(--black);transform:rotate(-4deg)}
.act .icon{font-size:16cqw;line-height:1;font-family:var(--fun)}
.act h2{margin:.2em 0 .3em;font-family:var(--fun);font-weight:400;font-size:10cqw;color:var(--red)}
.act p{margin:0;font-size:4.8cqw;line-height:1.5;font-weight:600}
.chip[data-c=fx].on{background:var(--black);color:var(--yellow)}
.corner{position:absolute;font-family:var(--fun);font-size:30px;line-height:1;z-index:1;
  text-shadow:2px 2px 0 var(--black);-webkit-text-stroke:1px var(--black)}
.corner.tl{top:10px;left:12px} .corner.br{bottom:10px;right:12px}
.front[data-c=yellow] .corner{color:#fff}
.label{position:absolute;top:14px;right:14px;z-index:1;font-family:var(--fun);font-size:14px;
  background:rgba(0,0,0,.28);color:#fff;padding:2px 10px;border-radius:999px}
.front[data-c=wild] .label,.front[data-c=yellow] .label{background:var(--black)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}

/* 操作按钮 */
.actions{display:flex;gap:12px;width:100%}
.btn{flex:1;font-family:var(--fun);font-size:21px;border:3px solid var(--black);border-radius:16px;
  padding:12px 0;cursor:pointer;box-shadow:0 5px 0 var(--black);transition:transform .12s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--black)}
.btn.next{background:var(--green);color:#fff;text-shadow:2px 2px 0 var(--black)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.reset{flex:0 0 52px;background:#fff;color:var(--black);font-size:26px}
.btn.refuse{background:var(--yellow);color:var(--black)}
.btn.fail{background:var(--red);color:#fff;text-shadow:2px 2px 0 var(--black)}
.btn.small{font-size:17px}
.btn[hidden]{display:none}
.hint{font-family:var(--fun);font-size:17px;text-align:center;min-height:22px;margin:-2px 0}
/* 三选一 */
.pick{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:4px 6px}
.mini{flex:1;max-height:132px;min-height:0;position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 6px;
  border-radius:16px;border:5px solid #fff;box-shadow:0 0 0 3px var(--black),0 6px 0 1px rgba(0,0,0,.25);cursor:pointer;
  animation:deal .5s cubic-bezier(.2,1.6,.4,1) both}
.mini:nth-child(1){transform:rotate(-1.5deg)} .mini:nth-child(2){transform:rotate(1.2deg);animation-delay:.1s} .mini:nth-child(3){transform:rotate(-.8deg);animation-delay:.2s}
.mini:active{filter:brightness(.92)}
.mini[data-c=red]{background:var(--red)} .mini[data-c=yellow]{background:var(--yellow)} .mini[data-c=green]{background:var(--green)}
.mini[data-c=blue]{background:var(--blue)} .mini[data-c=black]{background:var(--black)}
.mini[data-c=wild]{background:conic-gradient(from 20deg,var(--red) 0 25%,var(--blue) 0 50%,var(--yellow) 0 75%,var(--green) 0)}
.mini .lv{flex:0 0 30px;text-align:center;font-family:var(--fun);font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--black);-webkit-text-stroke:1px var(--black)}
.mini .box{flex:1;max-height:100%;overflow:hidden;background:#fff;border:2px solid var(--black);border-radius:10px;padding:5px 9px;
  color:var(--black);font-weight:800;font-size:14px;line-height:1.35}
.mini .chili{position:absolute;top:-12px;right:-8px;font-size:24px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5))}
.rb{display:inline-block;margin-right:5px;padding:0 6px;border-radius:6px;font-family:var(--fun);font-weight:400;font-size:12px;color:#fff;vertical-align:1px}
.rb[data-r=reverse]{background:var(--red)} .rb[data-r=pass]{background:var(--blue)} .rb[data-r=all]{background:var(--green)} .rb[data-r=metoo]{background:var(--purple)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:5;background:var(--black);color:#fff;font-family:var(--fun);font-size:16px;padding:8px 16px;border-radius:999px;animation:pop .3s cubic-bezier(.2,1.8,.4,1)}

.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="dots" id="dots"></div>
<main>
  <div class="logo"><h1>聊聊卡</h1></div>

  <div class="filters">
    <div class="row" id="dirRow"></div>
    <div class="row" id="lvRow"></div>
  </div>

  <div class="hint" id="hint"></div>
  <div class="table" id="table"></div>

  <div class="actions">
    <button class="btn reset" id="reset" aria-label="清空已抽记录">↻</button>
    <button class="btn next" id="next">输了！抽三张</button>
    <button class="btn refuse small" id="refuse" hidden>不答 ×2</button>
    <button class="btn fail small" id="fail" hidden>不过关</button>
    <button class="btn next small" id="pass" hidden>过关 ✓</button>
  </div>
</main>

<script>

  {k:"love",   name:"朋友与爱情", c:"red"},
  {k:"work",   name:"工作与金钱", c:"green"},
  {k:"life",   name:"生活与热爱", c:"blue"},
  {k:"self",   name:"自我与人生", c:"black"},
  {k:"couple", name:"情侣卡", c:"wild"},
];
const LVS = [{l:1,name:"浅"},{l:2,name:"中"},{l:3,name:"深"}];
const LVNAME = {1:"浅",2:"中",3:"深"};

// 功能卡
const RULE_P = 1/5, ACTION_P = 1/15;
const RULES = {
  reverse:{icon:"⇄", name:"赢家陪答", text:"赢家也要答这道题"},
  pass:   {icon:"→", name:"拉人垫背", text:"你点一个人，和你一起答"},
  passC:  {icon:"→", name:"拉人垫背", text:"再点一对情侣，和你们一起答"},
  all:    {icon:"+全", name:"全员快答", text:"每人一句话，你最后展开讲"},
  metoo:  {icon:"✋", name:"我也是", text:"讲完后，有类似经历的人举手补充"},
};
const ACTIONS = [
  {icon:"★", name:"赢家出题", text:"这轮不抽题：赢家现场想一道题，问输家。"},
];
function rulesFor(q){
  const r = [];
  if (q.s || q.d === "couple") r.push("reverse", q.d === "couple" ? "passC" : "pass");
  if (q.l === 1) r.push("all");
  if (q.l >= 2) r.push("metoo");
  return [...new Set(r)];
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const dirOf = k => DIRS.find(d => d.k === k);

const state = {dirs:new Set(["family","love","work","life","self","couple"]), lvs:new Set([1,2,3]),
  used:new Set(), fx:true, lastAction:false,
  mode:"idle", picks:[], queue:[], cur:null};

const $ = id => document.getElementById(id);
function chip(text, color, on, extra=""){
  const b = document.createElement("button");
  b.className = "chip " + extra + (on ? " on" : "");
  b.dataset.c = color; b.textContent = text; return b;
}
function renderFilters(){
  $("dirRow").replaceChildren(...DIRS.map(d => {
    const b = chip(d.name, d.c, state.dirs.has(d.k));
    b.onclick = () => toggle(state.dirs, d.k, b); return b;
  }));
  const fx = chip("功能卡", "fx", state.fx);
  fx.onclick = () => { state.fx = !state.fx; renderFilters(); };
  $("dirRow").appendChild(fx);
  $("lvRow").replaceChildren(...LVS.map(v => {
    const b = chip(v.l + " · " + v.name, "black", state.lvs.has(v.l), "lv");
    b.onclick = () => toggle(state.lvs, v.l, b); return b;
  }));
}
function toggle(set, key, el){
  if (set.has(key) && set.size === 1){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); return; }
  set.has(key) ? set.delete(key) : set.add(key);
  renderFilters();
}
function pool(){ return QS.map((q,i)=>({...q,i})).filter(q => state.dirs.has(q.d) && state.lvs.has(q.l)); }
function left(){ return pool().filter(q => !state.used.has(q.i)); }

function renderBack(){
  $("table").innerHTML = `<div class="stack"><div class="card"></div><div class="card"></div></div>
    <div class="card back" id="back"><span>聊聊</span></div>`;
  $("back").onclick = draw3;
}
function renderCard(q, rule, note=""){
  const d = dirOf(q.d);
  $("table").innerHTML = `<div class="card front" data-c="${d.c}">
      <div class="oval"></div>
      <div class="corner tl">${LVNAME[q.l]}</div><div class="corner br">${LVNAME[q.l]}</div>
      <div class="label">${d.name}${note ? " · " + note : ""}</div>
      <div class="q">${rule ? `<span class="rule" data-r="${rule.replace("C","")}">${RULES[rule].icon} ${RULES[rule].name}<small>${RULES[rule].text}</small></span>` : ""}${q.q}${q.tag ? `<br><span class="tag">${q.tag}</span>` : ""}${q.f ? `<span class="f">→ ${q.f}</span>` : ""}</div>
      ${q.s ? `<div class="spicy">🌶️</div>` : ""}
    </div>`;
}
function renderAction(a){
  $("table").innerHTML = `<div class="card front" data-c="action">
      <div class="oval"></div>
      <div class="corner tl">${a.icon}</div><div class="corner br">${a.icon}</div>
      <div class="label">功能卡</div>
      <div class="act"><div class="icon">${a.icon}</div><h2>${a.name}</h2><p>${a.text}</p></div>
    </div>`;
}
// 流程：idle → choose（赢家三选一）→ answer（输家答）→ idle
function withRule(q){
  const rs = rulesFor(q);
  return {q, rule: state.fx && rs.length && Math.random() < RULE_P ? pick(rs) : null};
}
function takeRandom(list, n){
  const a = [...list], out = [];
  while (a.length && out.length < n) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]);
  return out;
}
function setButtons(mode){
  state.mode = mode;
  const show = {next: mode === "idle" || mode === "action", refuse: mode === "answer" && state.cur.canRefuse,
    fail: mode === "answer", pass: mode === "answer"};
  for (const k in show) $(k).hidden = !show[k];
  $("next").textContent = mode === "action" ? "下一局" : "输了！抽三张";
  $("hint").textContent = {idle:"玩一局小游戏，输的人来抽", choose:"👑 赢家挑一张，给输家答",
    action:"", answer: state.queue.length ? `还有 ${state.queue.length} 道等着你` : "输家请作答"}[mode];
}
function toIdle(){ state.picks = []; state.queue = []; state.cur = null; renderBack(); setButtons("idle"); }
function draw3(){
  if (state.fx && !state.lastAction && Math.random() < ACTION_P){
    state.lastAction = true; renderAction(pick(ACTIONS)); return setButtons("action");
  }
  state.lastAction = false;
  if (left().length < 3) state.used.clear();
  state.picks = takeRandom(left(), 3).map(withRule);
  $("table").innerHTML = `<div class="pick">${state.picks.map((p, i) => {
    const d = dirOf(p.q.d);
    return `<div class="mini" data-c="${d.c}" data-i="${i}">
      <div class="lv">${LVNAME[p.q.l]}</div>
      <div class="box">${p.rule ? `<span class="rb" data-r="${p.rule.replace("C","")}">${RULES[p.rule].icon} ${RULES[p.rule].name}</span>` : ""}${p.q.q}</div>
      ${p.q.s ? `<div class="chili">🌶️</div>` : ""}</div>`;
  }).join("")}</div>`;
  document.querySelectorAll(".mini").forEach(el => el.onclick = () => choose(+el.dataset.i));
  setButtons("choose");
}
function choose(i){
  const chosen = state.picks[i];
  state.rest = state.picks.filter((_, j) => j !== i);
  show({...chosen, canRefuse: state.rest.length > 0});
}
function show(item){
  state.cur = item; state.used.add(item.q.i);
  renderCard(item.q, item.rule, item.note || "");
  setButtons("answer");
}
function next(){
  if (state.queue.length) show(state.queue.shift()); else { toast("过关！下一局"); toIdle(); }
}
$("next").onclick = () => state.mode === "action" ? toIdle() : draw3();
$("pass").onclick = next;
$("refuse").onclick = () => {
  // 不答：改答赢家没选的另外两张
  state.queue = state.rest.map((p, k) => ({...p, note: `加罚 ${k + 1}/${state.rest.length}`}));
  state.rest = []; toast("不答？那就答另外两道！"); next();
};
$("fail").onclick = () => {
  const d = state.cur.q.d;
  let cand = left().filter(q => q.d === d);
  if (!cand.length) cand = left();
  if (!cand.length){ state.used.clear(); cand = left(); }
  state.queue.unshift({...withRule(pick(cand)), note: "追加"});
  toast("不过关！追加一题"); next();
};

// 背景圆点
const colors = ["--red","--yellow","--green","--blue"];
for (let i = 0; i < 14; i++){
  const s = 30 + Math.random() * 90, dot = document.createElement("i");
  Object.assign(dot.style, {width:s+"px", height:s+"px", left:Math.random()*100+"%", top:Math.random()*100+"%",
    background:`var(${colors[i%4]})`, animationDelay:(-Math.random()*9)+"s"});
  $("dots").appendChild(dot);
}
$("reset").onclick = () => {
  if (!state.used.size) return toast("还没抽过题");
  if (!confirm(`清空已抽过的 ${state.used.size} 道题？清空后它们可能会再被抽到。`)) return;
  state.used.clear(); toIdle();
  toast("已清空，所有题目重新可抽");
};
function toast(msg){
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
renderFilters(); toIdle();
</script>
</body>
</html>
